[project]
name = "house-price-causality"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "geopandas",
    "numpy",
    "requests",
    "contextily"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"